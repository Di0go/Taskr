{% load static %}
<!DOCTYPE html>
<html lang="pt">

  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Criar Projeto - Taskr</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
      <link 
        rel="stylesheet" 
        href="{% static 'project/creat_project.css' %}" />
  </head>

  <body>
      <div class="create-project-container">
          <!-- Header -->
          <div class="header-section">
              <h1>Criar Novo Projeto</h1>
          </div>

          <!-- Formulário -->
          <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              
              <button type="submit" class="btn-create">
                  <i class="bi bi-check-circle me-2"></i>Criar Projeto
              </button>
          </form>

          <a href="{% url 'projects:index' %}" class="btn-cancel">
              <i class="bi bi-arrow-left"></i>Cancelar e voltar
          </a>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
