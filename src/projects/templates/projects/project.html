{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
    >
    <link 
        rel="stylesheet" 
        href="{% static 'project/project.css' %}"
    />
</head>

<body>
    <div class="project-container">
        <!-- Header Section with navigation -->
         
        <div class="project-back">
            <a href="{% url 'projects:index' %}" class="back-link">
                    ← Back to Projects
            </a>
        </div>

        <div class="project-delete-project">
            {% if user != project.owner %}
                <form method="post" action="{% url 'projects:leave_project' project.id %}">
                    {% csrf_token %}
                    <button type="submit" class="action-button btn-leave">
                        Leave Project
                    </button>
                </form>
            {% else %}
                <form method="post" action="{% url 'projects:delete_project' project.id %}">
                    {% csrf_token %}
                    <button type="submit" class="action-button btn-delete">
                        Delete Project
                    </button>
                </form>
            {% endif %}
        </div>

        
        


        <!-- Content Section -->
        <div class="project-content">
            <!-- Task States Grid -->
            <div class="states-grid">
                {% for state in states %}
                    <div class="state-card">
                        <form method="post" action="{% url 'states:delete_state' state.id %}">
                            {% csrf_token %}
                            <button type="submit" class="state-delete-btn" title="Delete state">
                                ✕
                            </button>
                        </form>
                        <div class="state-name-btn">{{ state }}</div>
                    </div>
                {% endfor %}

                <!-- Create State Card -->
                <a href="{% url 'states:create_state' project.id %}" class="create-state-card">
                    <div class="create-state-content">
                        <span class="plus-icon">+</span>
                        <span class="create-text">Create State</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
