{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css"
    >
    <link 
        rel="stylesheet" 
        href="{% static 'project/project.css' %}"
    />
</head>

<body>
    <div class="project-container">
        <!-- Header Section with navigation -->
         
        <div class="project-back">
            <a href="{% url 'projects:index' %}" class="back-link">
                    ← Back to Projects
            </a>
        </div>

        <h1>{{ project.name }}</h1>

        <div class="project-delete-project">
            {% if user != project.owner %}
                <form method="post" action="{% url 'projects:leave_project' project.id %}">
                    {% csrf_token %}
                    <button type="submit" class="action-button btn-leave">
                        Leave Project
                    </button>
                </form>
            {% else %}
                <form method="post" action="{% url 'projects:delete_project' project.id %}">
                    {% csrf_token %}
                    <button type="submit" class="action-button btn-delete">
                        Delete Project
                    </button>
                </form>
            {% endif %}
        </div>

        
        


        <!-- Content Section -->
        <div class="project-content">
            <!-- Task States Grid -->
            <div class="states-grid">
                {% for state in states %}
                    <div class="state-card">
                        <form method="post" action="{% url 'states:delete_state' state.id %}">
                            {% csrf_token %}
                            <button type="submit" class="state-delete-btn" title="Delete state">
                                ✕
                            </button>
                        </form>
                        <div class="state-name-btn">{{ state }}</div>
                    </div>
                {% endfor %}

                <!-- Create State Card - Changed to button -->
                <!-- Create State Card - Using div -->
                <div class="create-state-card" data-bs-toggle="modal" data-bs-target="#createStateModal" role="button" tabindex="0">
                    <div class="create-state-content">
                        <span class="plus-icon">+</span>
                        <span class="create-text">Create State</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Create State -->
    <div class="modal fade" id="createStateModal" tabindex="-1" aria-labelledby="createStateModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createStateModalLabel">Create a new state for this project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form method="post" action="{% url 'states:create_state' project.id %}" id="createStateForm">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="createStateForm" class="btn btn-primary">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
